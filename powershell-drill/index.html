<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="PowerShell のコマンドからサーバー管理、リモート実行までを、解説と模擬コンソールと確認テストで学ぶ教材です。">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>PowerShell 修練帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 左に章ナビ、右に「解説 → 実技（模擬コンソール）→ 確認テスト」の縦一列。コンソールは旧 PowerShell の紺色を両テーマで固定 */
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#141C2E; --muted:#56617A; --line:#D5DCE8;
  --accent:#2450C8; --accent-soft:#E2E9FB;
  --ok:#1D7443; --ok-soft:#E0F2E7; --warn:#8F5400; --warn-soft:#FAEFD8; --bad:#B4232F; --bad-soft:#FBE4E6;
  --term:#012456; --term-line:#0E3473; --t-fg:#EEEDF0; --t-dim:#9EA8C0; --t-cmd:#F9F1A5; --t-str:#6CC8EC;
  --t-var:#45DB72; --t-kw:#9BE6AC; --t-type:#B9C9FF; --t-err:#FF9090;
  --f-disp:'Dela Gothic One','Zen Kaku Gothic New',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --f-mono:'JetBrains Mono',Consolas,'Zen Kaku Gothic New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121B2E; --ink:#E3E8F3; --muted:#98A4BE; --line:#26324C;
  --accent:#8CADFF; --accent-soft:#1B2A52;
  --ok:#62D393; --ok-soft:#11301F; --warn:#F2B654; --warn-soft:#34280F; --bad:#FF7E89; --bad-soft:#3A161B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2E; --ink:#E3E8F3; --muted:#98A4BE; --line:#26324C;
  --accent:#8CADFF; --accent-soft:#1B2A52;
  --ok:#62D393; --ok-soft:#11301F; --warn:#F2B654; --warn-soft:#34280F; --bad:#FF7E89; --bad-soft:#3A161B;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.8;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 64px}
.wrap{max-width:1160px;margin:0 auto}
code,kbd{font-family:var(--f-mono);font-size:.88em}
p code,li code,td code,.note code,.task code{background:var(--accent-soft);color:var(--ink);padding:.05em .4em;border-radius:4px;white-space:nowrap}
a{color:var(--accent)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{padding-block:40px 28px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:32px;align-items:end;border-bottom:1px solid var(--line);margin-bottom:32px}
.top h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0 0 14px;letter-spacing:.01em;text-wrap:balance}
.top h1 .ps{font-family:var(--f-mono);font-weight:600;font-size:.5em;color:var(--accent);vertical-align:.35em;margin-right:.4em;letter-spacing:0}
.top h1 .cur{display:inline-block;width:.45em;height:.08em;background:var(--accent);margin-left:.15em;vertical-align:baseline;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.top h1 .cur{animation:none}}
.top p{margin:0;max-width:62ch;color:var(--muted)}
.top p + p{margin-top:8px;font-size:13.5px}
.prog{display:grid;gap:8px}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.prog .lbl b{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.reset{justify-self:end;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.reset.armed{color:var(--bad)}

/* layout */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:44px;align-items:start}
nav.toc{position:sticky;top:calc(16px + env(safe-area-inset-top, 0px));display:flex;flex-direction:column;gap:2px}
.toc a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:14px;line-height:1.45}
.toc a:hover{background:var(--surface);color:var(--ink)}
.toc a.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.toc .n{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.toc .c{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.toc .c.done{color:var(--ok)}
.toc .sep{height:1px;background:var(--line);margin:8px 10px}
@media (max-width:880px){
  .top{grid-template-columns:minmax(0,1fr);gap:20px}
  .layout{grid-template-columns:minmax(0,1fr);gap:20px}
  nav.toc{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .toc a{grid-template-columns:auto auto;white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
  .toc a .t{display:none}
  .toc a.on .t{display:inline}
  .toc a .c{display:none}
  .toc .sep{display:none}
}

/* スマホ幅では長いインラインコードを折り返し、画面の横はみ出しを防ぐ */
@media (max-width:880px){
  p code,li code,.note code,.task code{white-space:normal;overflow-wrap:anywhere}
}

/* article */
main{min-width:0}
.chap-head{margin-bottom:8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
main h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,3.4vw,32px);line-height:1.3;margin:4px 0 12px;text-wrap:balance}
.lead{font-size:16.5px;max-width:64ch;margin:0 0 28px}
main h3{font-size:18px;font-weight:700;margin:36px 0 10px;text-wrap:balance;display:flex;align-items:center;gap:10px}
main h3::before{content:"";width:10px;height:10px;background:var(--accent);border-radius:2px;flex:none}
main p{max-width:66ch;margin:0 0 14px}
.sect-title{font-family:var(--f-disp);font-weight:400;font-size:21px;margin:56px 0 6px;padding-top:24px;border-top:1px solid var(--line)}
.sect-sub{color:var(--muted);font-size:14px;margin:0 0 18px}

.code{position:relative;background:var(--term);color:var(--t-fg);border-radius:10px;margin:0 0 16px;border:1px solid var(--term-line)}
.code .lang{position:absolute;top:8px;right:12px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--t-dim);text-transform:uppercase}
.code pre{margin:0;padding:16px 18px;overflow-x:auto;font-family:var(--f-mono);font-size:13.5px;line-height:1.7}
.code.bash{background:#1d1f24;border-color:#30333b}
.h-cmd{color:var(--t-cmd)} .h-par{color:var(--t-dim)} .h-str{color:var(--t-str)} .h-var{color:var(--t-var)}
.h-kw{color:var(--t-kw)} .h-com{color:#7E9A86;font-style:italic} .h-num{color:#FFFFFF} .h-type{color:var(--t-type)}

.note{border-left:3px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 16px;max-width:70ch;font-size:14.5px}
.note b{display:block;font-size:12.5px;color:var(--accent);letter-spacing:.04em;margin-bottom:2px}

.tbl{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;background:color-mix(in srgb, var(--surface) 70%, var(--bg))}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}

.win{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;padding:0 6px;border-radius:4px;border:1px solid var(--warn);color:var(--warn);line-height:1.6;vertical-align:.1em}

/* drills */
.drill{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 18px}
.drill-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.dnum{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chip{font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.task{margin:0 0 12px;max-width:none}
.term{background:var(--term);border-radius:8px;border:1px solid var(--term-line);font-family:var(--f-mono);font-size:13.5px;color:var(--t-fg);overflow:hidden}
.term .log{padding:12px 14px 0;overflow-x:auto;max-height:380px;overflow-y:auto}
.term .log:empty{display:none}
.term .log pre{margin:0 0 10px;font-family:inherit;white-space:pre;line-height:1.6}
.term .log .err{color:var(--t-err)}
.term .log .dim{color:var(--t-dim)}
.line{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.prompt{color:var(--t-fg);white-space:nowrap}
.line input{flex:1 1 200px;min-width:0;background:transparent;border:0;color:var(--t-cmd);font:inherit;padding:2px 0;caret-color:var(--t-cmd)}
.line input:focus{outline:none}
.term:focus-within{border-color:var(--t-str)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:8px;font-size:13.5px;cursor:pointer;line-height:1.5}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.fb{margin-top:10px;font-size:14px;padding:10px 14px;border-radius:8px;max-width:none}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.ng{background:var(--warn-soft);color:var(--warn)}
.fb.info{background:var(--accent-soft);color:var(--ink)}
.fb code{background:transparent;padding:0;font-weight:600}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.quiz .q{font-weight:700;margin:0 0 10px;max-width:none}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:14.5px;cursor:pointer;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ex{margin-top:10px;font-size:14px;color:var(--muted);max-width:none}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;flex-wrap:wrap}
.pager a{display:block;padding:12px 16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface);min-width:0}
.pager a small{display:block;color:var(--muted);font-size:12px}
.pager a:hover{border-color:var(--accent)}
.pager .nx{margin-left:auto;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span class="ps">PS&gt;</span>PowerShell 修練帳<span class="cur" aria-hidden="true"></span></h1>
      <p>コマンドの規則からパイプライン、サーバー管理、リモート実行までを 8 章で学びます。各章は「解説 → 実技（模擬コンソールに入力）→ 確認テスト」の順です。</p>
      <p>PowerShell 7 は Windows / Linux / macOS で動きます。<span class="win">WIN</span> の付いた課題は Windows 専用のコマンドです。実技の出力はサンプルで、入力はパターン照合で判定します（エイリアスや大文字小文字の違いは許容）。</p>
    </div>
    <div class="prog">
      <div class="lbl"><span>進捗（実技＋テスト）</span><b id="pgText">0 / 0</b></div>
      <div class="bar"><i id="pgBar"></i></div>
      <button class="reset" id="reset" type="button">進捗をリセット</button>
    </div>
  </header>
  <div class="layout">
    <nav class="toc" id="toc" aria-label="章"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
const R = String.raw;

/* ---------- 判定用ユーティリティ ---------- */
const ALIAS = {gci:'get-childitem',ls:'get-childitem',dir:'get-childitem','?':'where-object',where:'where-object','%':'foreach-object',foreach:'foreach-object',select:'select-object',sort:'sort-object',measure:'measure-object',gps:'get-process',ps:'get-process',gsv:'get-service',gc:'get-content',cat:'get-content',type:'get-content',gm:'get-member',gcm:'get-command',ft:'format-table',fl:'format-list',echo:'write-output',write:'write-output',sls:'select-string',gal:'get-alias',help:'get-help',man:'get-help',tnc:'test-netconnection',icm:'invoke-command',ipcsv:'import-csv',epcsv:'export-csv',spps:'stop-process',kill:'stop-process',gcim:'get-ciminstance',irm:'invoke-restmethod',iwr:'invoke-webrequest'};
const KNOWN = new Set('get-command get-help get-alias get-member get-process stop-process start-process get-service start-service stop-service restart-service where-object select-object sort-object measure-object foreach-object group-object get-childitem get-content set-content add-content select-string get-item new-item copy-item move-item remove-item test-path set-location get-location write-output write-host write-warning write-error import-csv export-csv convertto-json convertfrom-json convertto-csv format-table format-list format-wide out-file out-gridview invoke-restmethod invoke-webrequest test-netconnection test-connection resolve-dnsname get-nettcpconnection get-netipaddress get-netadapter get-netroute get-ciminstance get-winevent get-executionpolicy set-executionpolicy invoke-command enter-pssession new-pssession get-verb update-help get-date start-transcript stop-transcript unblock-file debug-process wait-process get-psdrive tee-object compare-object get-random start-sleep get-history clear-host get-unique'.split(' '));
const MISSING = {grep:'Select-String',tail:'Get-Content -Tail',head:'Select-Object -First',wc:'Measure-Object',awk:'Select-Object / ForEach-Object',sed:'-replace 演算子',ifconfig:'Get-NetIPAddress',dig:'Resolve-DnsName',ss:'Get-NetTCPConnection',touch:'New-Item',which:'Get-Command'};

function canon(s){
  s = s.replace(/[\u201c\u201d]/g,'"').replace(/[\u2018\u2019]/g,"'").replace(/\u3000/g,' ');
  s = s.trim().toLowerCase().replace(/\$psitem\b/g,'$_');
  s = s.replace(/\s+/g,' ');
  s = s.replace(/\s*([|{}(),=;])\s*/g,'$1');
  s = s.replace(/;+$/,'');
  s = s.replace(/(^|[|;{(])([a-z][\w-]*|\?|%)(?=[ |;{}]|$)/g,(m,p,w)=>p+(ALIAS[w]||w));
  return s;
}
const P = n => R`['"]?(\.[\\/])?` + n.replace(/\./g,'\\.') + R`['"]?`;
const wh = (prop, op, val, str) => R`where-object(( -filterscript)?\{\$_\.` + prop + ' ' + op + ' ' + (str ? R`['"]` + val + R`['"]` : val) + R`\}| (-property )?` + prop + ' ' + op + ' ' + (str ? R`['"]?` + val + R`['"]?` : val) + ')';
const SORTD = p => R`sort-object( (-property )?` + p + R` -desc\w*| -desc\w* (-property )?` + p + ')';
const SELF = (props, n) => R`select-object( (-property )?` + props + ' -first ' + n + '| -first ' + n + ' (-property )?' + props + ')';
const RX = (...parts) => new RegExp('^' + parts.join('') + '$');

const ERR_NR = t => `${t}: The term '${t}' is not recognized as a name of a cmdlet, function, script file, or executable program.\nCheck the spelling of the name, or if a path was included, verify that the path is correct and try again.`;

const GTRAPS = [
  {re:/format-(table|list|wide)\|/, msg:'Format-Table / Format-List の後ろはパイプでつながないでください。Format-* は表示用の書式オブジェクトを出力するため、元のプロパティが失われます。整形はパイプラインの最後だけで行います。'},
  {re:/==/, msg:'PowerShell の等価比較は <code>-eq</code> です。<code>==</code> は使えません。'},
  {re:/</, out:"ParserError: The '<' operator is reserved for future use.", err:true, msg:'<code>&lt;</code> は予約されていて使えません。「より小さい」は <code>-lt</code>、「以下」は <code>-le</code> です。'},
  {re:/>/, msg:'<code>&gt;</code> はリダイレクト（ファイルへの書き出し）です。比較には <code>-gt</code>（より大きい）や <code>-ge</code>（以上）を使います。この入力では数字の名前のファイルが作られるだけで、条件判定になりません。'}
];

function judge(d, raw){
  const c = canon(raw);
  if(!c) return null;
  for(const item of d.ok){
    const re = item instanceof RegExp ? item : item.re;
    if(re.test(c)){
      if(d.check){ return d.check(raw, c); }
      return {ok:true, out: item.out || d.out};
    }
  }
  for(const t of (d.traps||[])) if(t.re.test(c)) return {ok:false, msg:t.msg, out:t.out, err:t.err};
  for(const t of GTRAPS) if(t.re.test(c)) return {ok:false, msg:t.msg, out:t.out, err:t.err};
  for(const seg of c.split('|')){
    const m = seg.match(/^([a-z][a-z0-9]*(-[a-z0-9]+)?)(?=[ (]|$)/);
    if(!m) continue;
    const tok = m[1];
    if(MISSING[tok]) return {ok:false, out:ERR_NR(tok), err:true, msg:`<code>${tok}</code> は Windows の PowerShell にはありません。対応するのは <code>${MISSING[tok]}</code> です。`};
    if(tok.includes('-') && !KNOWN.has(tok)) return {ok:false, out:ERR_NR(tok), err:true, msg:'コマンド名を確認してください。綴りの誤りか、存在しないコマンドです。'};
  }
  return {ok:false, msg:'コマンドとしては成立していますが、課題の条件と一致しません。ヒントを確認してください。'};
}

/* ---------- 章データ ---------- */
const PROC_HEAD = R` NPM(K)    PM(M)      WS(M)     CPU(s)      Id  SI ProcessName
 ------    -----      -----     ------      --  -- -----------`;

const CH = [
{ id:'basics', title:'コマンドの形と調べ方',
  lead:'PowerShell のコマンド（コマンドレット）は「動詞-名詞」で統一されています。名前の規則と、知らないコマンドを自分で調べる方法を最初に押さえます。',
  body:[
    {h:'動詞-名詞という規則'},
    {p:'<code>Get-Process</code>、<code>Stop-Process</code>、<code>Get-Service</code>、<code>Restart-Service</code> のように、<b>動詞は決められた一覧から選び</b>、名詞は単数形で対象を表します。動詞の一覧は <code>Get-Verb</code> で確認できます。規則が揃っているので、「サービスを再起動したい」なら <code>Restart-Service</code> だろう、と名前を推測できます。'},
    {code:R`Get-Verb | Where-Object Group -eq 'Lifecycle'   # Start, Stop, Restart などの動詞`},
    {h:'調べるための 3 つのコマンド'},
    {table:{head:['コマンド','役割','例'], rows:[
      ['Get-Command','コマンドを探す','Get-Command *service*'],
      ['Get-Help','使い方を読む','Get-Help Get-Service -Examples'],
      ['Get-Member','出力の中身（型・プロパティ）を調べる','Get-Service | Get-Member']], code:[0,2]}},
    {p:'Get-Help は、最初に管理者権限で <code>Update-Help</code> を実行してヘルプ本体をダウンロードしておくと詳しい内容が表示されます。<code>Get-Help コマンド名 -Online</code> でブラウザ版のドキュメントも開けます。'},
    {h:'エイリアス'},
    {p:'<code>ls</code>、<code>cd</code>、<code>cat</code> のような短い名前はエイリアス（別名）で、実体は <code>Get-ChildItem</code>、<code>Set-Location</code>、<code>Get-Content</code> です。対話中はエイリアスで素早く打ち、スクリプトには正式名を書くのが一般的です。'},

{ id:'pipeline', title:'オブジェクトとパイプライン',
  lead:'PowerShell と Bash の最大の違いです。パイプ <code>|</code> を流れるのはテキストではなく、プロパティを持った .NET オブジェクトです。',
  body:[

    {p:'画面に表のように見えているのは、パイプラインの最後でオブジェクトが表示用に整形された結果です。途中では常にオブジェクトのまま受け渡されます。'},
    {h:'中身を調べる: Get-Member'},
    {p:'どんなプロパティがあるかわからないときは、パイプの途中に <code>Get-Member</code> を挟みます。TypeName（型名）と、Property（値）、Method（操作）などの一覧が表示されます。'},

    {h:'よく使う 5 つ'},
    {table:{head:['コマンド','役割','Bash で近いもの'], rows:[

     ok:[RX(R`['"]web01\.example\.com['"] -like ['"]web\*['"]`)],
     traps:[{re:/-eq ['"]web\*/, out:'False', msg:'<code>-eq</code> はワイルドカードを解釈せず、文字どおり「web*」と比較します。ワイルドカードは <code>-like</code> です。'},
            {re:/-match ['"]web\*/, msg:'<code>-match</code> は正規表現です。正規表現の <code>*</code> は「直前の文字の 0 回以上の繰り返し」なので意味が変わります。ワイルドカードは <code>-like</code> です。'}],
     hint:'ワイルドカードで比較する演算子は <code>-like</code> です。',
     ans:R`'web01.example.com' -like 'web*'`,
     out:'True'},
    {task:'文字列 <code>\'192.168.1.10\'</code> が「数字.数字.数字.数字」の形かを、<code>-match</code>（正規表現）で判定してください。',
     ok:[RX(R`['"]192\.168\.1\.10['"] -match ['"].+['"]`)],
     check(raw){
       const m = raw.match(/-match\s*(['"])(.+)\1\s*;?\s*$/i);
       if(!m) return {ok:false, msg:'正規表現を引用符で囲んでください。'};
       let re; try{ re = new RegExp(m[2], 'i'); }catch(e){ return {ok:false, out:`ParserError: Invalid pattern '${m[2]}'`, err:true, msg:'正規表現の書き方に誤りがあります。'}; }
       const r = re.test('192.168.1.10');
       if(!r) return {ok:false, out:'False', msg:'False になりました。<code>\\d+</code> は「1 文字以上の数字」、<code>\\.</code> は「ドットそのもの」を表します。'};
       const strict = /^\^/.test(m[2]) && /\$$/.test(m[2]);
       return {ok:true, out:'True', note: strict ? '' : '補足: <code>^</code> と <code>$</code> で先頭と末尾を固定しないと、「abc192.168.1.10xyz」のような文字列にも一致します。'};
     },
     hint:'例: <code>\'^\\d+\\.\\d+\\.\\d+\\.\\d+$\'</code>。<code>\\d</code> は数字、<code>\\.</code> はドット、<code>^</code> と <code>$</code> は先頭と末尾です。',
     ans:R`'192.168.1.10' -match '^\d+\.\d+\.\d+\.\d+$'`,
     out:'True'},
    {task:'作成済みのハッシュテーブル <code>$srv = @{ Name = \'web01\'; IP = \'10.0.0.11\' }</code> から、IP の値を取り出してください。',
     ok:[RX(R`\$srv(\.ip|\[['"]ip['"]\])`)],
     hint:'キーは <code>$srv.キー</code> または <code>$srv[\'キー\']</code> で参照します。',
     ans:'$srv.IP',
     out:'10.0.0.11'}
  ],
  quiz:[
    {q:'<code>$name = \'web01\'; \'host: $name\'</code> の出力は？', opts:['host: web01','host: $name','エラー'], a:1, ex:'シングルクォート内は展開されません。'},
    {q:'<code>\'ABC\' -eq \'abc\'</code> の結果は？', opts:['True','False','エラー'], a:0, ex:'既定では大文字小文字を区別しません。区別するには -ceq を使います。'},
    {q:'<code>if ($a &gt; 5) { ... }</code> を実行するとどうなる？', opts:['$a が 5 より大きければ実行される','「5」という名前のファイルに $a が書き出され、条件は偽になる','構文エラーで止まる'], a:1, ex:'> はリダイレクトです。比較には -gt を使います。'}
  ]},

{ id:'control', title:'制御構文・関数・エラー処理',
  lead:'条件分岐、繰り返し、関数、エラー処理です。作業をスクリプト（.ps1）にまとめて自動化する段階で必要になります。',
  body:[
    {h:'条件分岐'},
    {code:R`if ($cpu -gt 90) { 'CRITICAL' }
elseif ($cpu -gt 70) { 'WARNING' }
else { 'OK' }

switch -Wildcard ($hostname) {
    'web*'  { 'Web サーバー' }
    'db*'   { 'DB サーバー' }
    default { '不明' }
}`},
    {h:'繰り返し'},
    {p:'foreach 文は対象をすべてメモリに読み込んでから回すため高速です。ForEach-Object はパイプラインで 1 件ずつ受け取りながら処理するため、大量のデータでもメモリを抑えられます。'},
    {code:R`foreach ($s in 'web01', 'web02') { Test-Connection $s -Count 1 }
1..3 | ForEach-Object { "試行 $_ 回目" }
for ($i = 0; $i -lt 3; $i++) { $i }`},
    {h:'関数とパラメーター'},
    {code:R`function Test-Port {
    param(
        [Parameter(Mandatory)][string]$ComputerName,
        [int]$Port = 443
    )
    $r = Test-NetConnection -ComputerName $ComputerName -Port $Port -WarningAction SilentlyContinue
    [PSCustomObject]@{ Host = $ComputerName; Port = $Port; Open = $r.TcpTestSucceeded }
}
Test-Port -ComputerName web01 -Port 22`},
    {p:'関数名も動詞-名詞にしておくと、標準のコマンドレットと同じ感覚で使えます。<code>return</code> を書かなくても、関数の中で出力されたものはすべて戻り値になります。'},
    {h:'エラー処理: 終了エラーと非終了エラー'},
    {p:'PowerShell のエラーには「終了エラー」と「非終了エラー」があります。ファイルが見つからないなど多くのエラーは非終了エラーで、表示されるだけで処理は続き、<code>try/catch</code> には入りません。catch で捕まえるには <code>-ErrorAction Stop</code> を付けて終了エラーに変えます。'},
    {code:R`try {
    Get-Content .\config.json -ErrorAction Stop | ConvertFrom-Json
}
catch {
    Write-Warning "設定ファイルを読めません: $($_.Exception.Message)"
}
finally {
    'チェック終了'
}`},
    {note:'スクリプト全体でエラー時に止めたい場合は、先頭に <code>$ErrorActionPreference = \'Stop\'</code> を書きます。'},
    {h:'スクリプトの実行'},
    {p:'.ps1 ファイルはカレントディレクトリにあっても名前だけでは実行されず、<code>.\\backup.ps1</code> のようにパスを付けます。同名の悪意あるスクリプトがカレントに置かれていても、意図せず実行しないための仕様です。'}
  ],
  drills:[
    {task:'<code>1</code> から <code>5</code> までの各数値を 2 倍して表示してください（範囲演算子 <code>..</code> と ForEach-Object を使用）。',
     ok:[RX(R`1\.\.5\|foreach-object( -process)?\{\$_ ?\* ?2\}`), RX(R`foreach\(\$(\w+) in 1\.\.5\)\{\$\1 ?\* ?2\}`)],
     hint:'<code>1..5</code> をパイプで ForEach-Object に渡し、<code>$_ * 2</code> を出力します。',
     ans:'1..5 | ForEach-Object { $_ * 2 }',
     out:'2\n4\n6\n8\n10'},
    {task:'<code>$cpu</code>（値は 92）が 80 より大きければ <code>HIGH</code>、そうでなければ <code>OK</code> を表示する if 文を書いてください。',
     ok:[RX(R`if\(\$cpu -gt 80\)\{((write-(output|host)) )?['"]high['"]\}else\{((write-(output|host)) )?['"]ok['"]\}`)],
     hint:'形は <code>if (条件) { ... } else { ... }</code> です。「より大きい」は <code>-gt</code>。',
     ans:R`if ($cpu -gt 80) { 'HIGH' } else { 'OK' }`,
     out:'HIGH'},
    {task:'存在しないファイル <code>nofile.txt</code> を Get-Content で読み、エラーを <code>try/catch</code> で捕まえて、catch の中で <code>$_</code> を使ってエラーメッセージを表示してください。',
     ok:[RX(R`try\{get-content (?=[^}]*nofile\.txt)[^}]*-(erroraction|ea) ['"]?stop['"]?[^}]*\}catch\{[^}]*\$_[^}]*\}`)],
     traps:[{re:/^try\{get-content(?![^}]*-(erroraction|ea))/, err:true,
             out:R`Get-Content: Cannot find path 'C:\Users\yamagata\lab\nofile.txt' because it does not exist.`,
             msg:'エラーは表示されましたが、catch ブロックは実行されていません。Get-Content のこのエラーは非終了エラーなので、<code>-ErrorAction Stop</code> を付けて終了エラーにする必要があります。'},
            {re:/catch\{(?![^}]*\$_)/, msg:'catch の中で <code>$_</code>（捕まえたエラー）を出力してください。'}],
     hint:'<code>try { Get-Content .\\nofile.txt -ErrorAction Stop } catch { ... }</code> の形です。',
     ans:R`try { Get-Content .\nofile.txt -ErrorAction Stop } catch { "読めません: $($_.Exception.Message)" }`,
     out:R`読めません: Cannot find path 'C:\Users\yamagata\lab\nofile.txt' because it does not exist.`}
  ],
  quiz:[
    {q:'Get-Content の「ファイルが見つからない」エラーを try/catch で捕まえるには？', opts:['何もしなくても捕まえられる','-ErrorAction Stop を付ける','-Force を付ける'], a:1, ex:'非終了エラーは catch に入らないため、-ErrorAction Stop で終了エラーに変えます。'},
    {q:'foreach 文と ForEach-Object の違いとして正しいものは？', opts:['違いはない','foreach 文は全件をメモリに読み込んでから回し、ForEach-Object はパイプラインで 1 件ずつ処理する','ForEach-Object の方が常に速い'], a:1, ex:'速度は foreach 文が有利なことが多く、メモリ使用量は ForEach-Object が有利です。'},
    {q:'カレントにある backup.ps1 を実行する書き方は？', opts:['backup.ps1','.\\backup.ps1','run backup.ps1'], a:1, ex:'カレントのスクリプトは名前だけでは実行されない仕様です。'}
  ]},

{ id:'output', title:'出力の整形と変換',

    {code:R`Get-Service | Select-Object Name, Status | Export-Csv .\svc.csv    # 正しい

{ id:'admin', title:'サーバー管理とネットワーク',
  lead:'インフラの業務で実際によく使うコマンドです。サービス、ハードウェア情報、イベントログ、ネットワーク診断を扱います。',
  body:[
    {h:'サービス'},
    {p:'Windows のサービスは、Linux の systemd ユニットに相当する常駐プログラムです。サービスには Name（内部名）と DisplayName（表示名）があり、コマンドでは Name を使います。たとえば IIS（Windows の Web サーバー）の公開機能は Name が <code>W3SVC</code>、表示名が「World Wide Web Publishing Service」です。'},
    {code:R`Get-Service -Name W3SVC, WinRM
Restart-Service -Name Spooler
Get-Service | Where-Object { $_.Status -eq 'Stopped' -and $_.StartType -eq 'Automatic' }`},
    {note:'最後の例は「自動起動に設定されているのに止まっているサービス」を探すもので、障害調査の最初によく使います。'},
    {h:'CIM: OS とハードウェアの情報'},
    {p:'CIM（Common Information Model）は OS やハードウェアの情報を共通の形式で取得するための標準で、WMI はその Windows 実装です。クラス名を指定して情報を取り出します。<code>Win32_OperatingSystem</code> は OS、<code>Win32_LogicalDisk</code> はドライブ、<code>Win32_ComputerSystem</code> は機種やメモリ量の情報です。'},
    {code:R`Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, LastBootUpTime
Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
    Select-Object DeviceID, @{ n = 'FreeGB'; e = { [math]::Round($_.FreeSpace / 1GB, 1) } }`},
    {note:'<code>DriveType=3</code> はローカルの固定ディスクを表します（2 はリムーバブル、4 はネットワークドライブ、5 は光学ドライブ）。'},
    {h:'イベントログ'},
    {p:'Windows のイベントログは、Linux の journald や syslog に相当します。主なログは System（OS やドライバー）、Application（アプリケーション）、Security（ログオンなどの監査記録）の 3 つです。'},
    {code:R`Get-WinEvent -LogName System -MaxEvents 20
Get-WinEvent -FilterHashtable @{ LogName = 'System'; Level = 2; StartTime = (Get-Date).AddDays(-1) }`},
    {note:'Level 2 はエラーです（1 が重大、3 が警告、4 が情報）。古い Get-EventLog は PowerShell 7 では削除されているので、Get-WinEvent を使います。'},
    {h:'ネットワーク'},
    {table:{head:['目的','PowerShell','従来のコマンド','Linux'], rows:[

const CHEAT = [
  ['ls','Get-ChildItem','gci, dir'],['cd','Set-Location','cd, sl'],['pwd','Get-Location','pwd, gl'],
  ['cat file','Get-Content file','gc'],['tail -f file','Get-Content file -Tail 10 -Wait',''],

  ['sort | uniq -c','Group-Object','group'],['cut / awk で列を取る','Select-Object Name, Id',''],
  ['touch file','New-Item file',''],['mkdir dir','New-Item -ItemType Directory dir','mkdir'],
  ['cp -r','Copy-Item -Recurse','cp, copy'],['mv','Move-Item','mv, move'],['rm -rf dir','Remove-Item dir -Recurse -Force','rm, del'],
  ['> / >>','Out-File / Add-Content','> と >> も使える'],['echo $PATH','$env:PATH',''],["export X=1","$env:X = '1'",''],

  ['ps','Get-Process','gps, ps'],['kill PID','Stop-Process -Id PID','kill'],
  ['systemctl status svc','Get-Service svc','gsv'],['journalctl','Get-WinEvent',''],
  ['ip addr','Get-NetIPAddress',''],['ping host','Test-Connection host',''],['nc -zv host 443','Test-NetConnection host -Port 443','tnc'],
  ['dig host','Resolve-DnsName host',''],['ss -tln','Get-NetTCPConnection -State Listen',''],

/* ---------- 状態 ---------- */
const KEY = 'ps-shuren-v1';
let state = {d:{}, q:{}};
try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.d) state = s; }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- 表示 ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const HL = /(#[^\n]*)|('(?:[^'\n]|'')*'|"[^"\n]*")|(\$[\w:]+)|(\b(?:if|elseif|else|foreach|for|while|switch|try|catch|finally|function|param|return|in|default)\b)|(-[a-z]\w*)|(\b[a-z]+-[a-z][a-z0-9]+\b)|(\[[a-z.]+\])|(\b\d[\d.]*(?:gb|mb|kb)?\b)/gi;
const CLS = ['h-com','h-str','h-var','h-kw','h-par','h-cmd','h-type','h-num'];
function hl(src){
  let out = '', last = 0;
  src.replace(HL, (m, ...g) => {
    const idx = g[8];
    out += esc(src.slice(last, idx));
    const k = g.slice(0,8).findIndex(x => x !== undefined);
    out += `<span class="${CLS[k]}">${esc(m)}</span>`;
    last = idx + m.length;
    return m;
  });
  return out + esc(src.slice(last));
}

function counts(ch){
  const total = ch.drills.length + ch.quiz.length;
  let done = 0;
  ch.drills.forEach((_,i)=>{ if(state.d[ch.id+'-'+i]) done++; });
  ch.quiz.forEach((_,i)=>{ if(state.q[ch.id+'-'+i]) done++; });
  return [done,total];
}
function renderProgress(){
  let d=0,t=0; CH.forEach(c=>{const [a,b]=counts(c); d+=a; t+=b;});
  document.getElementById('pgText').textContent = `${d} / ${t}`;
  document.getElementById('pgBar').style.width = (t? d/t*100 : 0) + '%';
}
function renderToc(cur){
  const toc = document.getElementById('toc');
  toc.innerHTML = CH.map((c,i)=>{
    const [d,t] = counts(c);
    return `<a href="#${c.id}" class="${cur===c.id?'on':''}"><span class="n">${i+1}</span><span class="t">${esc(c.title)}</span><span class="c ${d===t?'done':''}">${d}/${t}</span></a>`;
  }).join('') + `<div class="sep"></div><a href="#cheatsheet" class="${cur==='cheatsheet'?'on':''}"><span class="n">≡</span><span class="t">Bash 対応表</span><span class="c"></span></a>`;
}

function block(b){
  if(b.h) return `<h3>${b.h}</h3>`;
  if(b.p) return `<p>${b.p}</p>`;
  if(b.code!==undefined){
    const bash = b.lang==='bash';
    return `<div class="code ${bash?'bash':''}"><span class="lang">${bash?'bash':'PowerShell'}</span><pre><code>${bash?esc(b.code):hl(b.code)}</code></pre></div>`;
  }
  if(b.note) return `<aside class="note">${b.label?`<b>${b.label}</b>`:''}${b.note}</aside>`;
  if(b.table){
    const t=b.table, cc=t.code||[];
    return `<div class="tbl"><table><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map((x,i)=>`<td>${cc.includes(i)?`<code>${esc(x)}</code>`:esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

function renderChapter(id){
  const i = CH.findIndex(c=>c.id===id), ch = CH[i];
  const drills = ch.drills.map((d,k)=>{
    const key = ch.id+'-'+k, solved = !!state.d[key];
    return `<div class="drill" data-key="${key}">
      <div class="drill-head"><span class="dnum">実技 ${k+1}</span><span class="chip ${solved?'ok':''}">${solved?'クリア':'未挑戦'}</span>${d.win?'<span class="win">WIN</span>':''}</div>
      <p class="task">${d.task}</p>
      <div class="term">
        <div class="log" aria-live="polite"></div>
        <form class="line" data-key="${key}"><label class="prompt" for="in-${key}">PS C:\\Users\\yamagata\\lab&gt;</label><input id="in-${key}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="コマンドを入力"></form>
      </div>
      <div class="acts"><button class="btn pri" data-act="run" type="button">実行</button><button class="btn" data-act="hint" type="button">ヒント</button><button class="btn" data-act="ans" type="button">解答例</button></div>
      <div class="fb" hidden></div>
    </div>`;
  }).join('');
  const quiz = ch.quiz.map((q,k)=>{
    const key = ch.id+'-'+k;
    return `<div class="quiz" data-key="${key}"><p class="q">Q${k+1}. ${q.q}</p><div class="opts">${q.opts.map((o,j)=>`<button class="opt" type="button" data-j="${j}">${o}</button>`).join('')}</div><p class="ex" hidden></p></div>`;
  }).join('');
  const prev = CH[i-1], next = CH[i+1];
  return `<div class="chap-head"><div class="eyebrow">Chapter ${i+1} / ${CH.length}</div><h2>${esc(ch.title)}</h2></div>
    <p class="lead">${ch.lead}</p>
    ${ch.body.map(block).join('')}
    <div class="sect-title">実技</div><p class="sect-sub">入力して Enter または「実行」。何度でも試せます。</p>
    ${drills}
    <div class="sect-title">確認テスト</div><p class="sect-sub">選択肢を 1 つ選ぶと、正誤と解説が表示されます。</p>
    ${quiz}
    <div class="pager">${prev?`<a href="#${prev.id}"><small>前の章</small>${esc(prev.title)}</a>`:''}${next?`<a class="nx" href="#${next.id}"><small>次の章</small>${esc(next.title)}</a>`:`<a class="nx" href="#cheatsheet"><small>付録</small>Bash 対応表</a>`}</div>`;
}

function renderCheat(){
  return `<div class="chap-head"><div class="eyebrow">Appendix</div><h2>Bash 対応表</h2></div>
  <p class="lead">Linux で慣れている操作を PowerShell で書くとどうなるかの早見表です。右端は対話中に使える主なエイリアスです（Linux 版 PowerShell では ls、cat、ps などのエイリアスは無効です）。</p>
  <div class="tbl"><table><thead><tr><th>Bash</th><th>PowerShell</th><th>エイリアス・補足</th></tr></thead><tbody>
  ${CHEAT.map(r=>`<tr><td><code>${esc(r[0])}</code></td><td><code>${esc(r[1])}</code></td><td>${esc(r[2])}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="pager"><a href="#${CH[CH.length-1].id}"><small>前の章</small>${esc(CH[CH.length-1].title)}</a><a class="nx" href="#${CH[0].id}"><small>最初へ</small>${esc(CH[0].title)}</a></div>`;
}

function route(){
  const h = location.hash.slice(1);
  const id = (h==='cheatsheet' || CH.some(c=>c.id===h)) ? h : CH[0].id;
  document.getElementById('main').innerHTML = id==='cheatsheet' ? renderCheat() : renderChapter(id);
  renderToc(id); renderProgress();
}

function findDrill(key){
  const [cid, k] = [key.slice(0,key.lastIndexOf('-')), +key.slice(key.lastIndexOf('-')+1)];
  return CH.find(c=>c.id===cid).drills[k];
}
function runDrill(card){
  const key = card.dataset.key, d = findDrill(key);
  const input = card.querySelector('input'), raw = input.value;
  if(!raw.trim()) { input.focus(); return; }
  const r = judge(d, raw);
  const log = card.querySelector('.log');
  let html = `<pre><span class="dim">PS C:\\Users\\yamagata\\lab&gt;</span> ${hl(raw)}</pre>`;
  if(r.out) html += `<pre class="${r.err?'err':''}">${esc(r.out)}</pre>`;
  log.insertAdjacentHTML('beforeend', html);
  while(log.children.length > 8) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
  const fb = card.querySelector('.fb');
  fb.hidden = false;
  if(r.ok){
    fb.className = 'fb ok';
    fb.innerHTML = '正解です。' + (r.note ? ' ' + r.note : '');
    if(!state.d[key]){ state.d[key] = true; save(); }
    const chip = card.querySelector('.chip'); chip.textContent='クリア'; chip.classList.add('ok');
    renderToc(location.hash.slice(1) || CH[0].id); renderProgress();
  } else {
    fb.className = 'fb ng'; fb.innerHTML = r.msg;
  }
  input.value = '';
}

if(typeof document !== 'undefined'){
  document.addEventListener('submit', e=>{
    const f = e.target.closest('form.line'); if(!f) return;
    e.preventDefault(); runDrill(f.closest('.drill'));
  });
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-act]');
    if(b){
      const card = b.closest('.drill'), d = findDrill(card.dataset.key), fb = card.querySelector('.fb');
      if(b.dataset.act==='run') runDrill(card);
      else if(b.dataset.act==='hint'){ fb.hidden=false; fb.className='fb info'; fb.innerHTML='ヒント: '+d.hint; }
      else if(b.dataset.act==='ans'){ fb.hidden=false; fb.className='fb info'; fb.innerHTML='解答例: <code>'+esc(d.ans)+'</code>'; const inp=card.querySelector('input'); inp.value=d.ans; inp.focus(); }
      return;
    }
    const o = e.target.closest('.opt');
    if(o){
      const box = o.closest('.quiz'), key = box.dataset.key;
      const cid = key.slice(0,key.lastIndexOf('-')), k = +key.slice(key.lastIndexOf('-')+1);
      const q = CH.find(c=>c.id===cid).quiz[k], j = +o.dataset.j;
      box.querySelectorAll('.opt').forEach((x,i)=>{ x.disabled = true; if(i===q.a) x.classList.add('right'); });
      if(j!==q.a) o.classList.add('wrong');
      const ex = box.querySelector('.ex'); ex.hidden=false; ex.innerHTML = (j===q.a?'正解。':'不正解。') + q.ex;
      if(j===q.a && !state.q[key]){ state.q[key]=true; save(); renderToc(cid); renderProgress(); }
      return;
    }
  });
  const rs = document.getElementById('reset');
  rs.addEventListener('click', ()=>{
    if(!rs.classList.contains('armed')){ rs.classList.add('armed'); rs.textContent='もう一度押すとリセットします'; setTimeout(()=>{rs.classList.remove('armed'); rs.textContent='進捗をリセット';}, 4000); return; }
    state = {d:{}, q:{}}; save(); rs.classList.remove('armed'); rs.textContent='進捗をリセット'; route();
  });
  window.addEventListener('hashchange', ()=>{ route(); window.scrollTo(0,0); });
  route();
}
