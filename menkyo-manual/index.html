<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="普通自動車免許（AT 限定）の学科試験（仮免・本免）を、章ごとの解説と○×の確認テストで対策する教材です。">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>運転免許 学科マニュアル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 左に章ナビ、右に「解説 → 確認テスト（○×）」の縦一列。PowerShell 修練帳と同じ骨組みで、配色だけ道路標識の青に寄せる */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#132033; --muted:#55657A; --line:#D3DCE6;
  --accent:#1A56A8; --accent-soft:#E0EAF7;
  --ok:#1D7443; --ok-soft:#E0F2E7; --warn:#8F5400; --warn-soft:#FAEFD8; --bad:#B4232F; --bad-soft:#FBE4E6;
  --f-disp:'Dela Gothic One','Zen Kaku Gothic New',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  --f-mono:'JetBrains Mono',Consolas,'Zen Kaku Gothic New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121B2E; --ink:#E3E8F3; --muted:#98A4BE; --line:#26324C;
  --accent:#86B0F0; --accent-soft:#1A2A4A;
  --ok:#62D393; --ok-soft:#11301F; --warn:#F2B654; --warn-soft:#34280F; --bad:#FF7E89; --bad-soft:#3A161B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2E; --ink:#E3E8F3; --muted:#98A4BE; --line:#26324C;
  --accent:#86B0F0; --accent-soft:#1A2A4A;
  --ok:#62D393; --ok-soft:#11301F; --warn:#F2B654; --warn-soft:#34280F; --bad:#FF7E89; --bad-soft:#3A161B;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.8;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 64px}
.wrap{max-width:1160px;margin:0 auto}
a{color:var(--accent)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b.k{background:var(--warn-soft);color:var(--ink);padding:0 .25em;border-radius:3px}

/* header */
.top{padding-block:40px 28px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:32px;align-items:end;border-bottom:1px solid var(--line);margin-bottom:32px}
.top h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0 0 14px;letter-spacing:.01em;text-wrap:balance}
.top h1 .mk{font-family:var(--f-mono);font-weight:600;font-size:.5em;color:var(--accent);vertical-align:.35em;margin-right:.4em;letter-spacing:0}
.top p{margin:0;max-width:62ch;color:var(--muted)}
.top p + p{margin-top:8px;font-size:13.5px}
.prog{display:grid;gap:8px}
.prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.prog .lbl b{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.reset{justify-self:end;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:0}
.reset.armed{color:var(--bad)}

/* layout */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:44px;align-items:start}
nav.toc{position:sticky;top:calc(16px + env(safe-area-inset-top, 0px));display:flex;flex-direction:column;gap:2px}
.toc a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:14px;line-height:1.45}
.toc a:hover{background:var(--surface);color:var(--ink)}
.toc a.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.toc .n{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.toc .c{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.toc .c.done{color:var(--ok)}
.toc .sep{height:1px;background:var(--line);margin:8px 10px}
@media (max-width:880px){
  .top{grid-template-columns:minmax(0,1fr);gap:20px}
  .layout{grid-template-columns:minmax(0,1fr);gap:20px}
  nav.toc{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .toc a{grid-template-columns:auto auto;white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
  .toc a .t{display:none}
  .toc a.on .t{display:inline}
  .toc a .c{display:none}
  .toc .sep{display:none}
}

/* article */
main{min-width:0}
.chap-head{margin-bottom:8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
main h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,3.4vw,32px);line-height:1.3;margin:4px 0 12px;text-wrap:balance}
.lead{font-size:16.5px;max-width:64ch;margin:0 0 28px}
main h3{font-size:18px;font-weight:700;margin:36px 0 10px;text-wrap:balance;display:flex;align-items:center;gap:10px}
main h3::before{content:"";width:10px;height:10px;background:var(--accent);border-radius:2px;flex:none}
main p{max-width:66ch;margin:0 0 14px}
main ul{max-width:66ch;margin:0 0 14px;padding-left:1.3em}
main li{margin-bottom:4px}
.sect-title{font-family:var(--f-disp);font-weight:400;font-size:21px;margin:56px 0 6px;padding-top:24px;border-top:1px solid var(--line)}
.sect-sub{color:var(--muted);font-size:14px;margin:0 0 18px}

.note{border-left:3px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 16px;max-width:70ch;font-size:14.5px}
.note b.lbl{display:block;font-size:12.5px;color:var(--accent);letter-spacing:.04em;margin-bottom:2px}
.note.new{border-left-color:var(--warn)}
.note.new b.lbl{color:var(--warn)}

.tbl{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;background:color-mix(in srgb, var(--surface) 70%, var(--bg));white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-weight:600;white-space:nowrap;color:var(--accent)}

/* quiz（○×） */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.quiz .q{font-weight:700;margin:0 0 10px;max-width:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:360px}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:20px;font-weight:700;cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ex{margin-top:10px;font-size:14px;color:var(--muted);max-width:none}
.ex b{color:var(--ink)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;flex-wrap:wrap}
.pager a{display:block;padding:12px 16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface);min-width:0}
.pager a small{display:block;color:var(--muted);font-size:12px}
.pager a:hover{border-color:var(--accent)}
.pager .nx{margin-left:auto;text-align:right}

.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot p{max-width:none;margin:0 0 6px}

/* ランダム出題（一問一答・模擬試験） */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:8px;font-size:14px;cursor:pointer;line-height:1.5}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.armed{background:var(--warn);border-color:var(--warn)}
.setup{display:flex;flex-wrap:wrap;gap:14px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 18px}
.setup label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0;flex:1 1 200px}
.setup select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.runbar{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-bottom:6px}
.runbar + .bar{margin-bottom:16px}
.quiz.big .q{font-size:17px}
.qch{font-size:12px;color:var(--accent);margin:0 0 4px;max-width:none}
.quiz.is-ok{border-left:4px solid var(--ok)}
.quiz.is-ng{border-left:4px solid var(--bad)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.score{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 12px}
.score b{font-family:var(--f-disp);font-weight:400;font-size:24px}
.score span{color:var(--muted);font-size:14px}
.score.pass b{color:var(--ok)}
.score.fail b{color:var(--bad)}
.gradebar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom, 0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.gradebar span{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span class="mk">○×</span>運転免許 学科マニュアル</h1>
      <p>普通自動車免許（第一種・AT 限定）の学科試験、仮免・本免の両方に向けた対策です。10 章で交通ルールと AT 車の扱いを整理し、各章の最後に試験と同じ○×形式の確認テストがあります。全章から出す一問一答と模擬試験もあります。</p>
      <p>数字は付録の「数字まとめ」に一覧にしています。2026 年に施行された改正（生活道路の法定速度、自転車のそばを通るときの義務）も反映しています。</p>
    </div>
    <div class="prog">
      <div class="lbl"><span>進捗（確認テスト）</span><b id="pgText">0 / 0</b></div>
      <div class="bar"><i id="pgBar"></i></div>
      <button class="reset" id="reset" type="button">進捗をリセット</button>
    </div>
  </header>
  <div class="layout">
    <nav class="toc" id="toc" aria-label="章"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
/*
  章データ。body のブロックは PowerShell 修練帳と同じ形式（h / p / ul / note / table）。
  quiz は○×式で、a が true なら「○（正しい）」が正解。
*/
const CH = [
{ id:'exam', title:'試験の仕組みと解き方',
  lead:'学科試験は、文章を読んで正しいか誤りかを答える○×式です。知識の量より、<b class="k">問題文を最後まで正確に読む</b>ことで点が変わります。最初に試験の形と、ひっかけの型を押さえます。',
  body:[
    {h:'仮免と本免の違い'},
    {table:{head:['','仮免許の学科','本免許の学科'], rows:[
      ['問題数','文章問題 50 問','文章問題 90 問＋イラスト問題 5 問'],
      ['配点','1 問 1 点（50 点満点）','文章 1 点、イラスト 2 点（100 点満点）'],
      ['合格点','45 点以上（90%）','90 点以上（90%）'],
      ['時間','30 分','50 分']]}},
    {p:'イラスト問題は、1 枚の絵について 3 つの文が付き、<b>3 つすべて正解して初めて 2 点</b>になります。1 つでも誤ると 0 点です。'},
    {note:'問題数や時間は、各都道府県の運転免許試験場や教習所の案内で必ず確認してください。ここに書いたのは全国で一般的な形式です。', label:'受ける前に'},
    {h:'ひっかけの型'},
    {p:'学科試験の問題文は、正しい内容の一部だけを変えて誤りにしたものが多く出ます。次の型を覚えておくと、どこを疑えばよいかが分かります。'},
    {table:{head:['型','例','読み方'], rows:[
      ['言い切り','「必ず」「すべて」「絶対に」','例外が 1 つでもあれば×。ただし法律が例外なく決めているものは○もある'],
      ['数字のすり替え','30m → 10m、5m → 3m','場所と数字の組み合わせで覚える。付録の数字まとめを参照'],
      ['「徐行」と「一時停止」','徐行すればよい／一時停止しなければならない','どちらが求められる場面かを区別する'],
      ['「追い越し」と「追い抜き」','追い越しは禁止／追い抜きも禁止','進路を変えるかどうかの違い。第 7 章'],
      ['「駐車」と「停車」','駐車禁止／駐停車禁止','停車もできない場所かどうか。第 7 章'],
      ['危険の予測','「〜だろう」と考えて進んだ','イラスト問題では「〜かもしれない」と考える選択が正解']]}},
    {h:'解き方の手順'},
    {ul:[
      '文末まで読む。「〜してはいけない」「〜しなくてもよい」で意味が逆になる',
      '主語を確認する。「車は」「歩行者は」「原付は」で答えが変わる',
      '場所と条件を拾う。「交差点で」「見通しの悪い」「信号のない」など',
      '迷ったら、事故が起きない側（より慎重な運転）を選ぶと正解であることが多い。ただし「安全のため」と書けば何でも○ではない'
    ]},
    {note:'「〜したほうが安全だから」と理由が付いていても、法律に反する行動なら×です。例：「後続車がいないので、黄色の中央線をはみ出して追い越した」。', label:'注意'}
  ],
  quiz:[
    {q:'本免許の学科試験では、イラスト問題 1 問につき 3 つの文のうち 2 つ正解すれば 1 点もらえる。', a:false, ex:'3 つすべて正解したときだけ 2 点で、部分点はありません。'},
    {q:'仮免許の学科試験は 50 問で、45 点以上で合格である。', a:true, ex:'90% の正解が必要です。'},
    {q:'問題文に「必ず」と書いてあれば、その問題は必ず×である。', a:false, ex:'「運転するときは必ず免許証を携帯する」のように例外のない決まりもあり、言い切りがすべて×とは限りません。根拠を考えて判断します。'}
  ]},

{ id:'signal', title:'信号と手信号',
  lead:'信号の意味は単純に見えますが、「黄色」「点滅」「矢印」と、警察官の手信号に細かい決まりがあります。',
  body:[
    {h:'信号の色の意味（車の場合）'},
    {table:{head:['信号','意味'], rows:[
      ['青','直進、左折、右折ができる（二段階右折の原付は右折できない）'],
      ['黄','停止位置から先へ進んではいけない。ただし、停止位置に近づいていて安全に止まれない場合はそのまま進める'],
      ['赤','停止位置から先へ進んではいけない。すでに交差点で右左折している車は、そのまま進める'],
      ['青の矢印','矢印の方向へ進める（赤信号と一緒に出ていても進める）。右折の矢印では二段階右折の原付は進めない'],
      ['黄の矢印','路面電車だけが進める。車は進めない'],
      ['黄の点滅','他の交通に注意して進める（一時停止の義務はない）'],
      ['赤の点滅','停止位置で一時停止し、安全を確かめてから進める']]}},
    {h:'停止位置'},
    {p:'停止線があれば<b>停止線の直前</b>。停止線がなければ<b>交差点の直前</b>。交差点の手前に横断歩道や自転車横断帯があれば、<b>その直前</b>です。'},
    {h:'警察官の手信号'},
    {p:'警察官に対してどちら向きにいるかで意味が決まります。身体の正面（または背中）に<b>向き合う</b>交通は赤、正面と<b>平行</b>する交通は青か黄です。'},
    {table:{head:['手信号','平行する交通','対面する交通'], rows:[
      ['腕を横に水平に上げる','青','赤'],
      ['腕を垂直に上げる','黄','赤'],
      ['灯火を横に振る（夜間）','青','赤'],
      ['灯火を頭上に上げる（夜間）','黄','赤']]}},
    {note:'信号機と警察官の手信号が違うときは、<b>警察官の手信号に従います</b>。', label:'優先順位'}
  ],
  quiz:[
    {q:'黄色の灯火信号では、停止位置に近づいていて安全に停止できない場合を除き、停止位置から先へ進んではいけない。', a:true, ex:'黄は「止まれ」の意味で、例外は安全に止まれない場合だけです。'},
    {q:'黄色の灯火の点滅信号では、車は停止位置で一時停止しなければならない。', a:false, ex:'一時停止が必要なのは赤の点滅です。黄の点滅は注意して進めます。'},
    {q:'赤色の灯火と青色の左折の矢印が出ているとき、車は左折できる。', a:true, ex:'矢印の方向へは赤信号でも進めます。'},
    {q:'黄色の矢印信号のとき、車は矢印の方向へ進むことができる。', a:false, ex:'黄色の矢印は路面電車専用です。'},
    {q:'警察官が腕を水平に上げているとき、警察官の身体の正面に対面する交通は青信号と同じ意味である。', a:false, ex:'対面する交通は赤、平行する交通が青です。'},
    {q:'信号機の信号と警察官の手信号が異なるときは、信号機の信号に従う。', a:false, ex:'警察官の手信号が優先です。'},
    {q:'赤色の灯火信号でも、すでに交差点で右左折している車は、そのまま進むことができる。', a:true, ex:'交差点の中で止まるとかえって危険なためです。'},
    {q:'停止線がなく、交差点の手前に横断歩道があるときの停止位置は、横断歩道の直前である。', a:true, ex:'停止線がなければ交差点の直前、その手前に横断歩道があれば横断歩道の直前です。'},
    {q:'赤色の灯火の点滅信号では、徐行して交差点に進むことができる。', a:false, ex:'赤の点滅は停止位置で一時停止です。徐行ではありません。'},

const KEY = 'menkyo-manual-v1';
let state = {q:{}};

/* ---------- 表示 ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function counts(ch){
  let done = 0;
  ch.quiz.forEach((_,i)=>{ if(state.q[ch.id+'-'+i]) done++; });
  return [done, ch.quiz.length];
}
function renderProgress(){
  let d=0,t=0; CH.forEach(c=>{const [a,b]=counts(c); d+=a; t+=b;});
  document.getElementById('pgText').textContent = `${d} / ${t}`;
  document.getElementById('pgBar').style.width = (t? d/t*100 : 0) + '%';
}
function renderToc(cur){
  const toc = document.getElementById('toc');
  toc.innerHTML = CH.map((c,i)=>{
    const [d,t] = counts(c);
    return `<a href="#${c.id}" class="${cur===c.id?'on':''}"><span class="n">${i+1}</span><span class="t">${esc(c.title)}</span><span class="c ${d===t?'done':''}">${d}/${t}</span></a>`;
  }).join('') + `<div class="sep"></div>`
    + Object.entries(MODES).map(([k,t])=>`<a href="#${k}" class="${cur===k?'on':''}"><span class="n">${k==='ichimon'?'?':'✎'}</span><span class="t">${t}</span><span class="c"></span></a>`).join('')
    + `<a href="#numbers" class="${cur==='numbers'?'on':''}"><span class="n">≡</span><span class="t">数字まとめ</span><span class="c"></span></a>`;
}

// 表のセルは HTML を書かないので esc する。本文（p / ul / note）は <b> を使うためそのまま出す
function block(b){
  if(b.h) return `<h3>${b.h}</h3>`;
  if(b.p) return `<p>${b.p}</p>`;
  if(b.ul) return `<ul>${b.ul.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  if(b.note) return `<aside class="note ${b.label && b.label.includes('改正') ? 'new' : ''}">${b.label?`<b class="lbl">${b.label}</b>`:''}${b.note}</aside>`;
  if(b.table){
    const t=b.table;
    return `<div class="tbl"><table><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return '';
}

</div>`;

function renderChapter(id){
  const i = CH.findIndex(c=>c.id===id), ch = CH[i];
  const quiz = ch.quiz.map((q,k)=>{
    const key = ch.id+'-'+k;
    return `<div class="quiz" data-key="${key}"><p class="q">Q${k+1}. ${q.q}</p><div class="opts"><button class="opt" type="button" data-v="1" aria-label="正しい">○</button><button class="opt" type="button" data-v="0" aria-label="誤り">×</button></div><p class="ex" hidden></p></div>`;
  }).join('');
  const prev = CH[i-1], next = CH[i+1];
  return `<div class="chap-head"><div class="eyebrow">Chapter ${i+1} / ${CH.length}</div><h2>${esc(ch.title)}</h2></div>
    <p class="lead">${ch.lead}</p>
    ${ch.body.map(block).join('')}
    <div class="sect-title">確認テスト</div><p class="sect-sub">文が正しければ○、誤りなら×を選ぶと、正誤と解説が表示されます。</p>

    <div class="pager">${prev?`<a href="#${prev.id}"><small>前の章</small>${esc(prev.title)}</a>`:''}${next?`<a class="nx" href="#${next.id}"><small>次の章</small>${esc(next.title)}</a>`:`<a class="nx" href="#numbers"><small>付録</small>数字まとめ</a>`}</div>
    ${FOOT}`;
}

function route(){
  const h = location.hash.slice(1);
  const id = (h==='numbers' || MODES[h] || CH.some(c=>c.id===h)) ? h : CH[0].id;
  document.getElementById('main').innerHTML =
    id==='numbers' ? renderNumbers() : id==='ichimon' ? renderIchimon() : id==='mogi' ? renderMogi() : renderChapter(id);
  renderToc(id); renderProgress();
}

/* ---------- ランダム出題（一問一答・模擬試験）----------
   第 1 章の問題は試験の形式についての問題なので、交通ルールの出題からは外す */
const POOL = CH.filter(c=>c.id!=='exam').flatMap(c=>c.quiz.map((q,k)=>({...q, key:c.id+'-'+k, ch:c.title})));
const MODES = {ichimon:'一問一答', mogi:'模擬試験'};
// 実行中のセッション。ページを再読み込みすると消える（途中経過は保存しない）
const run = {ichimon:null, mogi:null};

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function markCorrect(key){ if(!state.q[key]){ state.q[key] = true; save(); } }

function renderIchimon(){
  const r = run.ichimon;
  const head = `<div class="chap-head"><div class="eyebrow">Random</div><h2>一問一答</h2></div>`;
  if(!r){
    const chOpts = CH.filter(c=>c.id!=='exam').map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('');
    return `${head}<p class="lead">ランダムな順番で 1 問ずつ出題します。答えるとすぐに正誤と解説が表示されます。</p>
      <div class="setup">
        <label>出題範囲<select id="i-range"><option value="all">全章（${POOL.length} 問）</option>${chOpts}</select></label>
        <label>問題数<select id="i-count"><option value="10">10 問</option><option value="20" selected>20 問</option><option value="0">範囲内の全問</option></select></label>
        <button class="btn pri" type="button" data-act="i-start">始める</button>
      </div>${FOOT}`;
  }
  if(r.i >= r.list.length){
    const ok = r.res.filter(Boolean).length, ng = r.list.filter((_,k)=>!r.res[k]);
    return `${head}<div class="score"><b>${r.list.length} 問中 ${ok} 問正解</b><span>正答率 ${Math.round(ok/r.list.length*100)}%</span></div>
      ${ng.length ? `<div class="sect-title">間違えた問題</div>${ng.map(q=>reviewCard(q,null)).join('')}` : '<p>全問正解です。</p>'}
      <div class="acts"><button class="btn pri" type="button" data-act="i-retry">同じ条件でもう一度</button>${ng.length?'<button class="btn" type="button" data-act="i-wrong">間違えた問題だけ解き直す</button>':''}<button class="btn" type="button" data-act="i-reset">条件を変える</button></div>${FOOT}`;
  }
  const q = r.list[r.i], answered = r.res.length > r.i, ok = r.res.filter(Boolean).length;
  let opts = `<button class="opt" type="button" data-act="i-ans" data-v="1" aria-label="正しい">○</button><button class="opt" type="button" data-act="i-ans" data-v="0" aria-label="誤り">×</button>`;
  if(answered){
    const picked = r.picked[r.i];
    opts = [true,false].map(v=>`<button class="opt ${v===q.a?'right':''} ${v===picked&&v!==q.a?'wrong':''}" type="button" disabled>${v?'○':'×'}</button>`).join('');
  }
  return `${head}<div class="runbar"><span>問 ${r.i+1} / ${r.list.length}</span><span>正解 ${ok}</span></div>
    <div class="bar"><i style="width:${r.i/r.list.length*100}%"></i></div>
    <div class="quiz big"><p class="qch">${esc(q.ch)}</p><p class="q">${q.q}</p><div class="opts">${opts}</div>
    ${answered?`<p class="ex"><b>${r.res[r.i]?'正解':'不正解'}（答え：${q.a?'○':'×'}）</b> ${q.ex}</p><div class="acts"><button class="btn pri" type="button" data-act="i-next" id="i-next">${r.i+1<r.list.length?'次の問題':'結果を見る'}</button></div>`:''}
    </div>
    <div class="acts"><button class="btn" type="button" data-act="i-reset">やめて条件を選び直す</button></div>`;
}

// 結果画面で問題・答え・解説を並べる。picked が null なら選んだ答えは出さない
function reviewCard(q, picked){
  const ok = picked === q.a;
  const mine = picked === null ? '' : `あなたの答え：${picked===undefined?'未回答':picked?'○':'×'} ／ `;
  return `<div class="quiz ${picked===null?'':ok?'is-ok':'is-ng'}"><p class="qch">${esc(q.ch)}</p><p class="q">${q.q}</p><p class="ex"><b>${mine}答え：${q.a?'○':'×'}</b> ${q.ex}</p></div>`;
}

function renderMogi(){
  const r = run.mogi;
  const head = `<div class="chap-head"><div class="eyebrow">Random</div><h2>模擬試験</h2></div>`;
  if(!r){
    return `${head}<p class="lead">全章からランダムに出題し、すべて答えてから最後にまとめて採点します。本番と同じく、<b class="k">90% 以上で合格</b>です。</p>
      <div class="setup">
        <label>問題数<select id="m-count"><option value="20">20 問</option><option value="50" selected>50 問（仮免と同じ問題数）</option></select></label>
        <button class="btn pri" type="button" data-act="m-start">始める</button>
      </div>
      <aside class="note"><b class="lbl">本番との違い</b>本免許の 95 問、イラスト問題、制限時間は再現していません。問題は全部で ${POOL.length} 問なので、繰り返すと同じ問題が出ます。</aside>${FOOT}`;
  }
  if(r.graded){
    const ok = r.list.filter((q,k)=>r.picked[k]===q.a).length, need = Math.ceil(r.list.length*0.9), pass = ok >= need;
    return `${head}<div class="score ${pass?'pass':'fail'}"><b>${pass?'合格':'不合格'}　${ok} / ${r.list.length} 点</b><span>合格ライン ${need} 点（90%）</span></div>
      <div class="acts"><button class="btn pri" type="button" data-act="m-retry">新しい問題でもう一度</button><button class="btn" type="button" data-act="m-reset">問題数を変える</button></div>
      <div class="sect-title">答え合わせ</div>
      ${r.list.map((q,k)=>reviewCard(q, r.picked[k])).join('')}`;
  }
  const left = r.list.length - r.picked.filter(v=>v!==undefined).length;
  return `${head}<p class="sect-sub">答えは採点するまで表示されません。選び直すこともできます。</p>
    ${r.list.map((q,k)=>`<div class="quiz"><p class="q">問 ${k+1}. ${q.q}</p><div class="opts">${[true,false].map(v=>`<button class="opt ${r.picked[k]===v?'sel':''}" type="button" data-act="m-pick" data-k="${k}" data-v="${v?1:0}" aria-label="${v?'正しい':'誤り'}">${v?'○':'×'}</button>`).join('')}</div></div>`).join('')}
    <div class="gradebar"><span id="m-left">未回答 ${left} 問</span><button class="btn pri" type="button" data-act="m-grade">採点する</button></div>`;
}

function startIchimon(list){
  run.ichimon = {list, i:0, res:[], picked:[], range:run.ichimon?.range, count:run.ichimon?.count};
}
function handleMode(act, el){
  const main = document.getElementById('main');
  if(act==='i-start'){
    const range = document.getElementById('i-range').value, count = +document.getElementById('i-count').value;
    const src = range==='all' ? POOL : POOL.filter(q=>q.key.startsWith(range+'-'));
    const list = shuffle(src); run.ichimon = {list: count ? list.slice(0,count) : list, i:0, res:[], picked:[], range, count};
  }
  else if(act==='i-ans'){
    const r = run.ichimon, q = r.list[r.i], v = el.dataset.v==='1';
    r.picked[r.i] = v; r.res[r.i] = v===q.a;
    if(v===q.a) markCorrect(q.key);
  }
  else if(act==='i-next') run.ichimon.i++;
  else if(act==='i-retry'){
    const {range, count} = run.ichimon;
    const src = range==='all' ? POOL : POOL.filter(q=>q.key.startsWith(range+'-'));
    const list = shuffle(src); run.ichimon = {list: count ? list.slice(0,count) : list, i:0, res:[], picked:[], range, count};
  }
  else if(act==='i-wrong'){
    const r = run.ichimon; startIchimon(shuffle(r.list.filter((_,k)=>!r.res[k])));
  }
  else if(act==='i-reset') run.ichimon = null;
  else if(act==='m-start' || act==='m-retry'){
    const n = act==='m-start' ? +document.getElementById('m-count').value : run.mogi.list.length;
    run.mogi = {list: shuffle(POOL).slice(0,n), picked:[], graded:false};
  }
  else if(act==='m-pick'){
    // 選択だけは再描画せずにその場で切り替える（スクロール位置を保つため）
    const k = +el.dataset.k, v = el.dataset.v==='1';
    run.mogi.picked[k] = v;
    el.parentNode.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel', b===el));
    document.getElementById('m-left').textContent = `未回答 ${run.mogi.list.length - run.mogi.picked.filter(x=>x!==undefined).length} 問`;
    return;
  }
  else if(act==='m-grade'){
    const r = run.mogi, left = r.list.length - r.picked.filter(x=>x!==undefined).length;
    if(left && !el.classList.contains('armed')){ el.classList.add('armed'); el.textContent = `未回答が ${left} 問あります。もう一度押すと採点`; return; }
    r.graded = true;
    r.list.forEach((q,k)=>{ if(r.picked[k]===q.a) markCorrect(q.key); });
  }
  else if(act==='m-reset') run.mogi = null;
  const id = act[0]==='i' ? 'ichimon' : 'mogi';
  main.innerHTML = id==='ichimon' ? renderIchimon() : renderMogi();
  renderToc(id); renderProgress();
  // 次の問題や結果に切り替えたときは先頭へ。一問一答の回答直後は「次の問題」にフォーカス
  if(act==='i-ans') document.getElementById('i-next')?.focus();
  else window.scrollTo(0,0);
}

document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]');
  if(a){ handleMode(a.dataset.act, a); return; }
  const o = e.target.closest('.quiz[data-key] .opt');
  if(!o) return;
  const box = o.closest('.quiz'), key = box.dataset.key;
  const cid = key.slice(0,key.lastIndexOf('-')), k = +key.slice(key.lastIndexOf('-')+1);
  const q = CH.find(c=>c.id===cid).quiz[k];
  const picked = o.dataset.v === '1', correct = picked === q.a;
  box.querySelectorAll('.opt').forEach(x=>{ x.disabled = true; if((x.dataset.v==='1') === q.a) x.classList.add('right'); });
  if(!correct) o.classList.add('wrong');
  const ex = box.querySelector('.ex'); ex.hidden = false;
  ex.innerHTML = `<b>${correct?'正解':'不正解'}（答え：${q.a?'○':'×'}）</b> ${q.ex}`;
  if(correct && !state.q[key]){ state.q[key] = true; save(); renderToc(cid); renderProgress(); }
});
const rs = document.getElementById('reset');
rs.addEventListener('click', ()=>{
  if(!rs.classList.contains('armed')){ rs.classList.add('armed'); rs.textContent='もう一度押すとリセットします'; setTimeout(()=>{rs.classList.remove('armed'); rs.textContent='進捗をリセット';}, 4000); return; }
  state = {q:{}}; save(); rs.classList.remove('armed'); rs.textContent='進捗をリセット'; route();
});
window.addEventListener('hashchange', ()=>{ route(); window.scrollTo(0,0); });
route();
</script>
</body></html>
